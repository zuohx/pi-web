[package]
name = "pi-web-desktop"
version = "0.1.0"
description = "Tauri desktop shell for pi-web"
authors = ["pi-web"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
