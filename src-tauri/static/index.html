<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pi-web desktop</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0d10;
        color: #e5e7eb;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
      }
      .card {
        text-align: center;
        opacity: 0.85;
      }
      .title {
        font-size: 18px;
        margin-bottom: 8px;
      }
      .muted {
        font-size: 13px;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">Launching pi-web…</div>
      <div class="muted">The desktop shell is starting the local service.</div>
    </div>
  </body>
</html>
